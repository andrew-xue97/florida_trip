<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff7a59">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Florida Trip">
  <meta name="robots" content="noindex, nofollow">
  <title>Florida Trip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="scene">
    <div class="sky" aria-hidden="true"></div>
    <div class="stars" aria-hidden="true"></div>

    <svg class="sun" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#fff6c9"/>
          <stop offset="55%" stop-color="#ffd166"/>
          <stop offset="100%" stop-color="#ff7a59" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="100" cy="100" r="100" fill="url(#sunGlow)"/>
      <circle cx="100" cy="100" r="52" fill="#ffe08a"/>
    </svg>

    <svg class="cloud cloud-a" viewBox="0 0 120 40" aria-hidden="true">
      <path d="M20 34h80a16 16 0 0 0 0-32 20 20 0 0 0-38-4A18 18 0 0 0 20 34z" fill="#fff" opacity=".75"/>
    </svg>
    <svg class="cloud cloud-b" viewBox="0 0 120 40" aria-hidden="true">
      <path d="M20 34h80a16 16 0 0 0 0-32 20 20 0 0 0-38-4A18 18 0 0 0 20 34z" fill="#fff" opacity=".55"/>
    </svg>

    <svg class="palm palm-left" viewBox="0 0 200 320" aria-hidden="true">
      <path d="M100 320c4-70 2-130-14-190" stroke="#1d2a44" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="#1d2a44">
        <path d="M86 130C60 90 20 90 0 112c30-8 52 0 86 18z"/>
        <path d="M86 130C70 84 40 62 8 66c28 12 48 34 78 64z"/>
        <path d="M86 130C86 84 100 50 128 34c-14 30-20 54-42 96z"/>
        <path d="M86 130c24-34 60-44 92-30-30 0-56 12-92 30z"/>
        <path d="M86 130c34-14 70-4 90 22-28-10-54-14-90-22z"/>
      </g>
    </svg>
    <svg class="palm palm-right" viewBox="0 0 200 320" aria-hidden="true">
      <path d="M100 320c-4-70-2-130 14-190" stroke="#1d2a44" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="#1d2a44">
        <path d="M114 130c26-40 66-40 86-18-30-8-52 0-86 18z"/>
        <path d="M114 130c16-46 46-68 78-64-28 12-48 34-78 64z"/>
        <path d="M114 130c0-46-14-80-42-96 14 30 20 54 42 96z"/>
        <path d="M114 130c-24-34-60-44-92-30 30 0 56 12 92 30z"/>
        <path d="M114 130c-34-14-70-4-90 22 28-10 54-14 90-22z"/>
      </g>
    </svg>

    <header class="hero">
      <p class="eyebrow">Road trip crew</p>
      <h1>Florida <span>Trip</span></h1>
      <p class="tagline">Sun. Sand. Good company.</p>
      <form id="unlock-form" class="unlock" autocomplete="off">
        <label for="passcode" class="sr">Crew passcode</label>
        <input id="passcode" type="password" placeholder="Crew passcode" autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button type="submit">Unlock</button>
      </form>
      <p id="unlock-msg" class="msg" role="status"></p>
    </header>

    <div class="sea" aria-hidden="true">
      <svg class="wave wave-1" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60c100 40 200-40 300 0s200 40 300 0 200-40 300 0 200 40 300 0v60H0z"/></svg>
      <svg class="wave wave-2" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60c100 40 200-40 300 0s200 40 300 0 200-40 300 0 200 40 300 0v60H0z"/></svg>
      <svg class="wave wave-3" viewBox="0 0 1200 120" preserveAspectRatio="none"><path d="M0 60c100 40 200-40 300 0s200 40 300 0 200-40 300 0 200 40 300 0v60H0z"/></svg>
    </div>
  </main>

  <div id="trip-page" class="trip" hidden>
    <header class="trip-bar">
      <strong class="trip-title">Florida Trip</strong>
      <button id="lock-btn" class="lock-btn" type="button">Lock</button>
    </header>
    <main id="trip-body" class="trip-body"></main>
  </div>
  <script src="content.enc.js"></script>
  <script src="unlock.js"></script>
</body>
</html>
